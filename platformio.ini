[platformio]
default_envs = release

[env]
platform = ststm32@20.0.0
board = nucleo_l476rg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags = -Iinclude -Wall -Wextra -fstack-usage
lib_deps = cesi_grove, bosch_bme68x, bosch_bme280, fatfs
extra_scripts = pre:scripts/build_number.py

[env:release]
build_src_filter = +<*> -<diagnostic.c> -<diagnostic_sd.c>
build_type = release

[env:debug]
build_src_filter = +<*> -<diagnostic.c> -<diagnostic_sd.c>
build_type = debug
debug_build_flags = -O0 -g3 -fstack-usage

[env:diagnostic]
build_flags = ${env.build_flags} -Wl,-u,_printf_float
build_type = debug
build_src_filter = +<setup.c> +<diagnostic.c> +<nmea.c> +<parametres.c>

[env:diagnostic_sd_grove]
build_flags = ${env.build_flags} -DSD_GROVE_BREAKOUT
build_type = debug
build_src_filter = +<setup.c> +<diagnostic_sd.c> +<parametres.c>
